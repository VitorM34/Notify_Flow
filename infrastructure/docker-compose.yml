services:
  rabbitmq:
    image: rabbitmq:4-management
    container_name: notifyflow-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  postgres:
    image: postgres:16
    container_name: notifyflow-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: notifyflow
      POSTGRES_PASSWORD: notifyflow
      POSTGRES_DB: notifyflow
    volumes:
      - notifyflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notifyflow -d notifyflow"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  notifyflow-postgres-data:
